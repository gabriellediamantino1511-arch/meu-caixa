<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">
<title>Meu Caixa</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f4f6;
    color:#111827;
    padding-bottom:80px;
}

button,input,select{
    font:inherit;
}

button{
    cursor:pointer;
    border:none;
}

.app{
    max-width:1100px;
    margin:auto;
}

header{
    background:#111827;
    color:white;
    padding:20px;
    position:sticky;
    top:0;
    z-index:20;
}

.header-content{
    max-width:1100px;
    margin:auto;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:24px;
    font-weight:bold;
}

.data-header{
    font-size:13px;
    opacity:.8;
}

main{
    padding:20px;
}

h1{
    font-size:25px;
    margin-bottom:5px;
}

h2{
    font-size:21px;
    margin-bottom:15px;
}

h3{
    font-size:17px;
    margin-bottom:10px;
}

.subtitle{
    color:#6b7280;
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px;
    margin-bottom:20px;
}

.card{
    background:white;
    border-radius:16px;
    padding:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.card-label{
    font-size:13px;
    color:#6b7280;
    margin-bottom:8px;
}

.card-value{
    font-size:24px;
    font-weight:bold;
}

.card small{
    color:#6b7280;
}

.section{
    background:white;
    border-radius:16px;
    padding:20px;
    margin-bottom:18px;
    box-shadow:0 2px 8px rgba(0,0,0,.05);
}

.actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.btn{
    padding:13px 16px;
    border-radius:10px;
    font-weight:bold;
    background:#e5e7eb;
    color:#111827;
}

.btn-primary{
    background:#111827;
    color:white;
}

.btn-success{
    background:#16a34a;
    color:white;
}

.btn-danger{
    background:#dc2626;
    color:white;
}

.btn-warning{
    background:#f59e0b;
    color:white;
}

.btn-blue{
    background:#2563eb;
    color:white;
}

.btn-small{
    padding:7px 10px;
    border-radius:8px;
    font-size:13px;
}

.form-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
}

.form-group{
    margin-bottom:14px;
}

.form-group.full{
    grid-column:1/-1;
}

label{
    display:block;
    font-weight:bold;
    font-size:14px;
    margin-bottom:6px;
}

input,select{
    width:100%;
    padding:12px;
    border:1px solid #d1d5db;
    border-radius:9px;
    background:white;
    outline:none;
}

input:focus,select:focus{
    border-color:#111827;
}

.total-box{
    background:#f3f4f6;
    border-radius:12px;
    padding:15px;
    margin:15px 0;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:18px;
}

.total-box strong{
    font-size:24px;
}

.product-list{
    display:flex;
    flex-direction:column;
    gap:10px;
}

.product-row{
    border:1px solid #e5e7eb;
    border-radius:12px;
    padding:14px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
}

.product-info{
    flex:1;
}

.product-name{
    font-weight:bold;
    margin-bottom:4px;
}

.product-detail{
    font-size:13px;
    color:#6b7280;
}

.row-actions{
    display:flex;
    gap:6px;
    flex-wrap:wrap;
}

.table-wrapper{
    overflow-x:auto;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:12px 8px;
    border-bottom:1px solid #e5e7eb;
    text-align:left;
    font-size:14px;
}

th{
    color:#6b7280;
    font-size:12px;
    text-transform:uppercase;
}

.badge{
    display:inline-block;
    padding:5px 8px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.badge-green{
    background:#dcfce7;
    color:#166534;
}

.badge-red{
    background:#fee2e2;
    color:#991b1b;
}

.badge-yellow{
    background:#fef3c7;
    color:#92400e;
}

.badge-blue{
    background:#dbeafe;
    color:#1e40af;
}

.empty{
    text-align:center;
    padding:30px 15px;
    color:#6b7280;
}

.back{
    margin-bottom:15px;
}

.sale-cart{
    margin-top:15px;
}

.cart-item{
    display:grid;
    grid-template-columns:1fr 90px 100px 40px;
    align-items:center;
    gap:10px;
    padding:12px;
    border-bottom:1px solid #e5e7eb;
}

.cart-item input{
    padding:8px;
}

.remove-btn{
    background:#fee2e2;
    color:#991b1b;
    border-radius:7px;
    width:34px;
    height:34px;
}

.summary-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.summary-item{
    background:#f9fafb;
    padding:15px;
    border-radius:10px;
}

.summary-item span{
    display:block;
    color:#6b7280;
    font-size:13px;
    margin-bottom:5px;
}

.summary-item strong{
    font-size:20px;
}

.difference-positive{
    color:#166534;
}

.difference-negative{
    color:#991b1b;
}

.nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:white;
    border-top:1px solid #e5e7eb;
    z-index:30;
    padding:8px;
}

.nav-inner{
    max-width:700px;
    margin:auto;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
}

.nav button{
    background:white;
    padding:8px 4px;
    font-size:11px;
    color:#6b7280;
    border-radius:8px;
}

.nav button.active{
    background:#111827;
    color:white;
}

.notice{
    padding:12px 14px;
    border-radius:10px;
    margin-bottom:15px;
    background:#eff6ff;
    color:#1e40af;
}

.search{
    margin-bottom:15px;
}

hr{
    border:none;
    border-top:1px solid #e5e7eb;
    margin:20px 0;
}

@media(max-width:750px){
    .grid{
        grid-template-columns:repeat(2,1fr);
    }

    .actions{
        grid-template-columns:1fr 1fr;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .form-group.full{
        grid-column:auto;
    }

    main{
        padding:14px;
    }

    .section{
        padding:15px;
    }

    .summary-grid{
        grid-template-columns:1fr 1fr;
    }

    .cart-item{
        grid-template-columns:1fr 70px 80px 35px;
        font-size:13px;
    }
}

@media(max-width:450px){
    .grid{
        grid-template-columns:1fr 1fr;
    }

    .card{
        padding:13px;
    }

    .card-value{
        font-size:19px;
    }

    .actions{
        grid-template-columns:1fr;
    }

    .header-content{
        align-items:flex-start;
    }

    .logo{
        font-size:20px;
    }
}
</style>
</head>

<body>

<header>
    <div class="header-content">
        <div>
            <div class="logo">MEU CAIXA</div>
            <div class="data-header" id="dataHeader"></div>
        </div>
        <button class="btn btn-success btn-small" onclick="novaVenda()">+ Venda</button>
    </div>
</header>

<main id="app"></main>

<nav class="nav">
    <div class="nav-inner">
        <button onclick="inicio()" id="navInicio">⌂<br>Início</button>
        <button onclick="novaVenda()" id="navVenda">＋<br>Venda</button>
        <button onclick="estoque()" id="navEstoque">▣<br>Estoque</button>
        <button onclick="fechamento()" id="navFechamento">R$<br>Caixa</button>
        <button onclick="menuMais()" id="navMais">☰<br>Mais</button>
    </div>
</nav>

<script>
/* =========================================================
   MEU CAIXA
   Versão local
   ========================================================= */

const CHAVE = "meuCaixaDados";

let dados = carregarDados();

let telaAtual = "inicio";

let vendaEmEdicao = null;

let carrinho = [];


/* =========================================================
   UTILITÁRIOS
   ========================================================= */

function hoje(){
    const d = new Date();
    const ano = d.getFullYear();
    const mes = String(d.getMonth()+1).padStart(2,"0");
    const dia = String(d.getDate()).padStart(2,"0");
    return `${ano}-${mes}-${dia}`;
}

function formatarData(data){
    if(!data) return "";
    const partes = data.split("-");
    if(partes.length !== 3) return data;
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
}

function dinheiro(valor){
    return Number(valor || 0).toLocaleString("pt-BR",{
        style:"currency",
        currency:"BRL"
    });
}

function numero(valor){
    return Number(valor || 0);
}

function gerarId(prefixo="id"){
    return prefixo + Date.now() + Math.random().toString(16).slice(2);
}

function salvar(){
    localStorage.setItem(CHAVE,JSON.stringify(dados));
}

function dataAtualTexto(){
    const d = new Date();
    return d.toLocaleDateString("pt-BR",{
        weekday:"long",
        day:"2-digit",
        month:"long",
        year:"numeric"
    });
}


/* =========================================================
   CARREGAMENTO E COMPATIBILIDADE
   ========================================================= */

function carregarDados(){

    let salvo = localStorage.getItem(CHAVE);

    if(!salvo){
        return estruturaNova();
    }

    try{

        let d = JSON.parse(salvo);

        d.produtos = Array.isArray(d.produtos) ? d.produtos : [];
        d.vendas = Array.isArray(d.vendas) ? d.vendas : [];
        d.fiados = Array.isArray(d.fiados) ? d.fiados : [];
        d.saidas = Array.isArray(d.saidas) ? d.saidas : [];

        if(d.caixaInicial === undefined) d.caixaInicial = 0;
        if(!d.dataAtual) d.dataAtual = hoje();

        d.vendas.forEach(v=>{
            if(!v.id) v.id = gerarId("venda_");
            if(!v.data) v.data = d.dataAtual || hoje();
            if(!Array.isArray(v.itens)){
                v.itens = [];
            }
            if(v.total === undefined){
                v.total = v.itens.reduce(
                    (s,i)=>s + numero(i.quantidade)*numero(i.preco||i.valor||0),
                    0
                );
            }
        });

        d.produtos.forEach(p=>{
            if(!p.id) p.id = gerarId("prod_");
            if(p.estoque === undefined){
                p.estoque = numero(p.quantidade);
            }
            p.estoque = numero(p.estoque);
            p.preco = numero(p.preco||p.valor||0);
        });

        d.saidas.forEach(s=>{
            if(!s.id) s.id = gerarId("saida_");
            if(!s.data) s.data = d.dataAtual || hoje();
        });

        d.fiados.forEach(f=>{
            if(!f.id) f.id = gerarId("fiado_");
            if(!f.data) f.data = d.dataAtual || hoje();
            if(f.status === undefined) f.status = "Pendente";
        });

        return d;

    }catch(e){

        console.error(e);
        return estruturaNova();
    }
}

function estruturaNova(){
    return {
        produtos:[],
        vendas:[],
        fiados:[],
        saidas:[],
        caixaInicial:0,
        dataAtual:hoje()
    };
}


/* =========================================================
   CÁLCULOS
   ========================================================= */

function vendasDoDia(data=hoje()){
    return dados.vendas.filter(v=>v.data === data);
}

function saidasDoDia(data=hoje()){
    return dados.saidas.filter(s=>s.data === data);
}

function totalVendasDia(data=hoje()){
    return vendasDoDia(data).reduce(
        (s,v)=>s+numero(v.total),0
    );
}

function totalPorPagamento(data,pagamento){
    return vendasDoDia(data)
        .filter(v=>v.pagamento === pagamento)
        .reduce((s,v)=>s+numero(v.total),0);
}

function totalFiadoDia(data=hoje()){
    return vendasDoDia(data)
        .filter(v=>v.pagamento === "Fiado")
        .reduce((s,v)=>s+numero(v.total),0);
}

function pagamentosFiadosDia(data=hoje()){
    return dados.fiados
        .filter(f=>
            f.status === "Pago" &&
            f.dataPagamento === data
        )
        .reduce((s,f)=>s+numero(f.valor),0);
}

function pagamentosFiadosPorMetodo(data,pagamento){
    return dados.fiados
        .filter(f=>
            f.status === "Pago" &&
            f.dataPagamento === data &&
            f.pagamento === pagamento
        )
        .reduce((s,f)=>s+numero(f.valor),0);
}

function totalSaidasDia(data=hoje()){
    return saidasDoDia(data)
        .reduce((s,x)=>s+numero(x.valor),0);
}

function saidasDinheiroDia(data=hoje()){
    return saidasDoDia(data)
        .filter(x=>x.pagamento==="Dinheiro")
        .reduce((s,x)=>s+numero(x.valor),0);
}

function dinheiroEsperado(data=hoje()){
    return numero(dados.caixaInicial)
        + totalPorPagamento(data,"Dinheiro")
        + pagamentosFiadosPorMetodo(data,"Dinheiro")
        - saidasDinheiroDia(data);
}

function pendentes(){
    return dados.fiados.filter(f=>f.status !== "Pago");
}


/* =========================================================
   MENU / NAVEGAÇÃO
   ========================================================= */

function marcarNav(id){
    document.querySelectorAll(".nav button")
        .forEach(b=>b.classList.remove("active"));

    const el = document.getElementById(id);

    if(el) el.classList.add("active");
}

function menuMais(){

    telaAtual = "mais";

    marcarNav("navMais");

    document.getElementById("app").innerHTML = `
        <h1>Mais opções</h1>
        <p class="subtitle">Gerencie produtos, fiados, histórico e seus dados.</p>

        <div class="actions">

            <button class="btn btn-primary" onclick="produtos()">
                📦 Produtos
            </button>

            <button class="btn btn-primary" onclick="fiados()">
                📝 Fiados
            </button>

            <button class="btn btn-primary" onclick="saidas()">
                💸 Saídas
            </button>

            <button class="btn btn-primary" onclick="historico()">
                📊 Histórico
            </button>

            <button class="btn btn-blue" onclick="backup()">
                💾 Fazer backup
            </button>

            <button class="btn btn-blue" onclick="restaurarBackup()">
                ♻️ Restaurar backup
            </button>

            <button class="btn btn-warning" onclick="novoDia()">
                🌅 Novo dia
            </button>

        </div>
    `;
}


/* =========================================================
   INÍCIO
   ========================================================= */

function inicio(){

    telaAtual = "inicio";

    marcarNav("navInicio");

    const data = dados.dataAtual || hoje();

    document.getElementById("dataHeader").textContent =
        dataAtualTexto();

    const vendas = totalVendasDia(data);
    const fiado = totalFiadoDia(data);
    const saidasTotal = totalSaidasDia(data);
    const dinheiroHoje = totalPorPagamento(data,"Dinheiro");
    const pixHoje = totalPorPagamento(data,"Pix");
    const debitoHoje = totalPorPagamento(data,"Débito");
    const creditoHoje = totalPorPagamento(data,"Crédito");

    const pendentesValor = pendentes()
        .reduce((s,f)=>s+numero(f.valor),0);

    document.getElementById("app").innerHTML = `

        <h1>Olá 👋</h1>

        <p class="subtitle">
            ${formatarData(data)} • Controle do seu caixa
        </p>

        <div class="grid">

            <div class="card">
                <div class="card-label">Vendas hoje</div>
                <div class="card-value">${dinheiro(vendas)}</div>
                <small>${vendasDoDia(data).length} venda(s)</small>
            </div>

            <div class="card">
                <div class="card-label">Dinheiro</div>
                <div class="card-value">${dinheiro(dinheiroHoje)}</div>
                <small>vendas em dinheiro</small>
            </div>

            <div class="card">
                <div class="card-label">Fiados</div>
                <div class="card-value">${dinheiro(pendenteValorFormatado())}</div>
                <small>em aberto</small>
            </div>

            <div class="card">
                <div class="card-label">Saídas</div>
                <div class="card-value">${dinheiro(saidasTotal)}</div>
                <small>hoje</small>
            </div>

        </div>

        <div class="section">

            <h2>Ações rápidas</h2>

            <div class="actions">

                <button class="btn btn-primary" onclick="novaVenda()">
                    + Nova venda
                </button>

                <button class="btn btn-blue" onclick="estoque()">
                    📦 Estoque
                </button>

                <button class="btn btn-warning" onclick="novoFiado()">
                    📝 Novo fiado
                </button>

                <button class="btn btn-danger" onclick="novaSaida()">
                    💸 Registrar saída
                </button>

                <button class="btn btn-success" onclick="fechamento()">
                    💰 Fechamento
                </button>

                <button class="btn" onclick="historico()">
                    📊 Histórico
                </button>

            </div>

        </div>

        <div class="section">

            <h2>Resumo do dia</h2>

            <div class="summary-grid">

                <div class="summary-item">
                    <span>Dinheiro</span>
                    <strong>${dinheiro(dinheiroHoje)}</strong>
                </div>

                <div class="summary-item">
                    <span>Pix</span>
                    <strong>${dinheiro(pixHoje)}</strong>
                </div>

                <div class="summary-item">
                    <span>Débito</span>
                    <strong>${dinheiro(debitoHoje)}</strong>
                </div>

                <div class="summary-item">
                    <span>Crédito</span>
                    <strong>${dinheiro(creditoHoje)}</strong>
                </div>

            </div>

        </div>

        <div class="section">

            <h2>Caixa físico esperado</h2>

            <div class="total-box">
                <span>Valor esperado</span>
                <strong>${dinheiro(dinheiroEsperado(data))}</strong>
            </div>

            <button class="btn btn-primary" onclick="fechamento()">
                Abrir fechamento
            </button>

        </div>
    `;
}

function pendenteValorFormatado(){
    return pendentes()
        .reduce((s,f)=>s+numero(f.valor),0);
}


/* =========================================================
   PRODUTOS
   ========================================================= */

function produtos(){

    telaAtual = "produtos";

    marcarNav("navMais");

    renderProdutos("");
}

function renderProdutos(filtro){

    const lista = dados.produtos.filter(p=>
        p.nome.toLowerCase().includes(filtro.toLowerCase())
    );

    document.getElementById("app").innerHTML = `

        <button class="btn back" onclick="menuMais()">← Voltar</button>

        <h1>Produtos</h1>

        <p class="subtitle">
            Cadastre produtos, preços e estoque atual.
        </p>

        <div class="section">

            <button class="btn btn-primary" onclick="novoProduto()">
                + Cadastrar produto
            </button>

            <hr>

            <input
                class="search"
                placeholder="🔎 Procurar produto..."
                value="${filtro}"
                oninput="renderProdutos(this.value)"
            >

            <div class="product-list">

                ${
                    lista.length
                    ? lista.map(p=>`

                        <div class="product-row">

                            <div class="product-info">

                                <div class="product-name">
                                    ${esc(p.nome)}
                                </div>

                                <div class="product-detail">
                                    Preço: ${dinheiro(p.preco)}
                                    • Estoque: ${numero(p.estoque)}
                                </div>

                            </div>

                            <div class="row-actions">

                                <button
                                    class="btn btn-small btn-blue"
                                    onclick="editarProduto('${p.id}')">
                                    Editar
                                </button>

                                <button
                                    class="btn btn-small btn-danger"
                                    onclick="excluirProduto('${p.id}')">
                                    Excluir
                                </button>

                            </div>

                        </div>

                    `).join("")
                    :
                    `<div class="empty">Nenhum produto encontrado.</div>`
                }

            </div>

        </div>
    `;
}

function novoProduto(){

    document.getElementById("app").innerHTML = `

        <button class="btn back" onclick="produtos()">← Voltar</button>

        <h1>Novo produto</h1>

        <div class="section">

            <div class="form-group">
                <label>Nome do produto</label>
                <input id="produtoNome" placeholder="Ex.: Brigadeiro">
            </div>

            <div class="form-group">
                <label>Preço de venda</label>
                <input id="produtoPreco" type="number" step="0.01" min="0" placeholder="0,00">
            </div>

            <div class="form-group">
                <label>Estoque atual</label>
                <input id="produtoEstoque" type="number" step="1" min="0" placeholder="0">
            </div>

            <button class="btn btn-primary" onclick="salvarProduto()">
                Salvar produto
            </button>

        </div>
    `;
}

function salvarProduto(id=null){

    const nome = document.getElementById("produtoNome").value.trim();
    const preco = numero(document.getElementById("produtoPreco").value);
    const estoque = numero(document.getElementById("produtoEstoque").value);

    if(!nome){
        alert("Digite o nome do produto.");
        return;
    }

    if(id){

        const p = dados.produtos.find(x=>x.id===id);

        if(p){
            p.nome = nome;
            p.preco = preco;
            p.estoque = estoque;
        }

    }else{

        dados.produtos.push({
            id:gerarId("prod_"),
            nome,
            preco,
            estoque

function entradaEstoque(id){

    const p = dados.produtos.find(x=>x.id===id);

    if(!p) return;

    const qtd = Number(prompt(`Quantas unidades de "${p.nome}" entraram?`));

    if(!Number.isFinite(qtd) || qtd<=0) return;

    p.estoque += qtd;

    salvar();

    estoque();
}

function perdaEstoque(id){

    const p = dados.produtos.find(x=>x.id===id);

    if(!p) return;

    const qtd = Number(prompt(`Quantas unidades de "${p.nome}" foram perdidas?`));

    if(!Number.isFinite(qtd) || qtd<=0) return;

    if(qtd > p.estoque){
        alert("A quantidade de perda não pode ser maior que o estoque.");
        return;
    }

    p.estoque -= qtd;

    salvar();

    estoque();
}

function ajustarEstoque(id){

    const p = dados.produtos.find(x=>x.id===id);

    if(!p) return;

    const qtd = Number(prompt(
        `Qual é o estoque atual de "${p.nome}"?`,
        p.estoque
    ));

    if(!Number.isFinite(qtd) || qtd<0) return;

    p.estoque = qtd;

    salvar();

    estoque();
}

function prepararProximoDia(){

    if(!confirm("Iniciar um novo dia mantendo os produtos e o estoque atual?")){
        return;
    }

    dados.dataAtual = hoje();
    dados.caixaInicial = 0;

    salvar();

    alert("Novo dia preparado.");

    inicio();
}

function adicionarCarrinho(){

    const id = document.getElementById("produtoVenda").value;
    const qtd = Number(document.getElementById("quantidadeVenda").value);

    if(!id){
        alert("Selecione um produto.");
        return;
    }

    if(!Number.isInteger(qtd) || qtd<=0){
        alert("Digite uma quantidade válida.");
        return;
    }

    const p = dados.produtos.find(x=>x.id===id);

    if(!p) return;

    const existente = carrinho.find(x=>x.produtoId===id);

    const quantidadeAtual =
        existente ? existente.quantidade : 0;

    if(quantidadeAtual + qtd > p.estoque){
        alert(
            `Estoque insuficiente de ${p.nome}.\n` +
            `Disponível: ${p.estoque}`
        );
        return;
    }

    if(existente){
        existente.quantidade += qtd;
    }else{
        carrinho.push({
            produtoId:p.id,
            nome:p.nome,
            preco:p.preco,
            quantidade:qtd
        });
    }

    renderVenda();
}

function alterarQuantidadeCarrinho(index,valor){

    const qtd = Number(valor);

    if(!Number.isInteger(qtd) || qtd<=0){
        renderVenda();
        return;
    }

    const item = carrinho[index];

    const p = dados.produtos.find(x=>x.id===item.produtoId);

    if(!p) return;

    if(qtd > p.estoque){
        alert(`Estoque disponível: ${p.estoque}`);
        renderVenda();
        return;
    }

    item.quantidade = qtd;

    renderVenda();
}

function removerCarrinho(index){

    carrinho.splice(index,1);

    renderVenda();
}

function totalCarrinho(){

    return carrinho.reduce(
        (s,i)=>s + numero(i.preco)*numero(i.quantidade),
        0
    );
}


/* =========================================================
   REGISTRAR / EDITAR VENDA
   ========================================================= */

function registrarVenda(){

    if(carrinho.length===0){
        alert("Adicione pelo menos um produto.");
        return;
    }

    const pagamento =
        document.getElementById("pagamentoVenda").value;

    let cliente = "";

    if(pagamento==="Fiado"){

        cliente =
            document.getElementById("clienteFiado").value.trim();

        if(!cliente){
            alert("Informe o nome da pessoa do fiado.");
            return;
        }
    }

    /*
       Se for edição, primeiro devolvemos os produtos
       da venda antiga ao estoque.
    */

    if(vendaEmEdicao){

        const antiga = dados.vendas.find(
            v=>v.id===vendaEmEdicao
        );

        if(!antiga){
            alert("Venda não encontrada.");
            return;
        }

        antiga.itens.forEach(item=>{

            const p = dados.produtos.find(
                x=>x.id===item.produtoId
            );

            if(p){
                p.estoque += numero(item.quantidade);
            }
        });

        /*
          Se a venda antiga era um fiado ainda pendente,
          removemos o registro antigo.
        */

        if(antiga.pagamento==="Fiado"){

            dados.fiados = dados.fiados.filter(
                f=>f.vendaId!==antiga.id
            );
        }

        antiga.itens = carrinho.map(x=>({...x}));
        antiga.total = totalCarrinho();
        antiga.pagamento = pagamento;

        if(pagamento==="Fiado"){

            dados.fiados.push({
                id:gerarId("fiado_"),
                vendaId:antiga.id,
                pessoa:cliente,
                valor:antiga.total,
                data:antiga.data,
                status:"Pendente",
                pagamento:"",
                dataPagamento:""
            });
        }

        carrinho.forEach(item=>{

            const p = dados.produtos.find(
                x=>x.id===item.produtoId
            );

            if(p){
                p.estoque -= numero(item.quantidade);
            }
        });

        salvar();

        alert("Venda alterada com sucesso.");

        vendaEmEdicao = null;

        inicio();

        return;
    }


    /*
      NOVA VENDA
    */

    const venda = {
        id:gerarId("venda_"),
        data:dados.dataAtual || hoje(),
        itens:carrinho.map(x=>({...x})),
        total:totalCarrinho(),
        pagamento:pagamento
    };

    /*
      Confirma estoque antes de salvar.
    */

    for(const item of venda.itens){

        const p = dados.produtos.find(
            x=>x.id===item.produtoId
        );

        if(!p){
            alert(`Produto não encontrado: ${item.nome}`);
            return;
        }

        if(numero(item.quantidade)>numero(p.estoque)){
            alert(
                `Estoque insuficiente para ${item.nome}.`
            );
            return;
        }
    }

    /*
      Baixa o estoque somente agora.
    */

    venda.itens.forEach(item=>{

        const p = dados.produtos.find(
            x=>x.id===item.produtoId
        );

        p.estoque -= numero(item.quantidade);
    });

    dados.vendas.push(venda);

    if(pagamento==="Fiado"){

        dados.fiados.push({
            id:gerarId("fiado_"),
            vendaId:venda.id,
            pessoa:cliente,
            valor:venda.total,
            data:venda.data,
            status:"Pendente",
            pagamento:"",
            dataPagamento:""
        });
    }

    salvar();

    alert("Venda registrada!");

    carrinho = [];

    inicio();
}

function editarVenda(id){

    const venda = dados.vendas.find(v=>v.id===id);

    if(!venda) return;

    vendaEmEdicao = id;

    carrinho = venda.itens.map(item=>({
        produtoId:item.produtoId,
        nome:item.nome,
        preco:numero(item.preco),
        quantidade:numero(item.quantidade)
    }));

    renderVenda();

    setTimeout(()=>{

        const pagamento =
            document.getElementById("pagamentoVenda");

        if(pagamento){

            pagamento.value = venda.pagamento;

            pagamento.dispatchEvent(
                new Event("change")
            );

            if(venda.pagamento==="Fiado"){

                const f = dados.fiados.find(
                    x=>x.vendaId===venda.id
                );

                if(f){
                    document.getElementById(
                        "clienteFiado"
                    ).value = f.pessoa || "";
                }
            }
        }

    },50);
}

function cancelarVenda(id){

    const venda = dados.vendas.find(v=>v.id===id);

    if(!venda) return;

    if(!confirm("Cancelar esta venda?")) return;

    /*
      Devolve os produtos ao estoque.
    */

    venda.itens.forEach(item=>{

        const p = dados.produtos.find(
            x=>x.id===item.produtoId
        );

        if(p){
            p.estoque += numero(item.quantidade);
        }
    });

    dados.vendas = dados.vendas.filter(
        v=>v.id!==id
    );

    dados.fiados = dados.fiados.filter(
        f=>f.vendaId!==id
    );

    salvar();

    alert("Venda cancelada.");

    historico();
}

        numero(document.getElementById("saidaValor").value);

    const pagamento =
        document.getElementById("saidaPagamento").value;

    if(!motivo || valor<=0){
        alert("Informe motivo e valor.");
        return;
    }

    if(id){

        const s = dados.saidas.find(x=>x.id===id);

        if(s){
            s.motivo = motivo;
            s.valor = valor;
            s.pagamento = pagamento;
        }

    }else{

        dados.saidas.push({
            id:gerarId("saida_"),
            motivo,
            valor,
            pagamento,
            data:dados.dataAtual || hoje()
        });

    }

    salvar();

    saidas();
}

function editarSaida(id){

    const s = dados.saidas.find(x=>x.id===id);

    if(!s) return;

    document.getElementById("app").innerHTML = `

        <button class="btn back" onclick="saidas()">← Voltar</button>

        <h1>Editar saída</h1>

        <div class="section">

            <div class="form-group">
                <label>Motivo</label>
                <input id="saidaMotivo" value="${esc(s.motivo)}">
            </div>

            <div class="form-group">
                <label>Valor</label>
                <input id="saidaValor" type="number" step="0.01" value="${s.valor}">
            </div>

            <div class="form-group">
                <label>Forma de pagamento</label>

                <select id="saidaPagamento">

                    ${["Dinheiro","Pix","Débito","Crédito"].map(x=>
                        `<option ${s.pagamento===x?"selected":""}>${x}</option>`
                    ).join("")}

                </select>

            </div>

            <button class="btn btn-primary"
                onclick="salvarSaida('${s.id}')">
                Salvar alterações
            </button>

        </div>
    `;
}

function excluirSaida(id){

    if(!confirm("Excluir esta saída?")) return;

    dados.saidas = dados.saidas.filter(
        x=>x.id!==id
    );

    salvar();

    saidas();
}


/* =========================================================
   FECHAMENTO
   ========================================================= */

function fechamento(){

    telaAtual = "fechamento";

    marcarNav("navFechamento");

    const data = dados.dataAtual || hoje();

    const dinheiroVendas =
        totalPorPagamento(data,"Dinheiro");

    const pix =
        totalPorPagamento(data,"Pix");

    const debito =
        totalPorPagamento(data,"Débito");

    const credito =
        totalPorPagamento(data,"Crédito");

    const fiado =
        totalPorPagamento(data,"Fiado");

    const recebidoFiado =
        pagamentosFiadosDia(data);

    const saidasTotal =
        totalSaidasDia(data);

    const esperado =
        dinheiroEsperado(data);

    document.getElementById("app").innerHTML = `

        <h1>Fechamento</h1>

        <p class="subtitle">
            ${formatarData(data)}
        </p>

        <div class="section">

            <h2>Caixa inicial</h2>

            <div class="form-group">

                <label>Valor que havia no caixa no início do dia</label>

                <input
                    id="caixaInicial"
                    type="number"
                    step="0.01"
                    value="${numero(dados.caixaInicial)}"
                    onchange="alterarCaixaInicial(this.value)"
                >

            </div>

        </div>

        <div class="section">

            <h2>Entradas</h2>

            <div class="summary-grid">

                <div class="summary-item">
                    <span>Dinheiro</span>
                    <strong>${dinheiro(dinheiroVendas)}</strong>
                </div>

                <div class="summary-item">
                    <span>Pix</span>
                    <strong>${dinheiro(pix)}</strong>
                </div>

                <div class="summary-item">
                    <span>Débito</span>
                    <strong>${dinheiro(debito)}</strong>
                </div>

                <div class="summary-item">
                    <span>Crédito</span>
                    <strong>${dinheiro(credito)}</strong>
                </div>

                <div class="summary-item">
                    <span>Fiado</span>
                    <strong>${dinheiro(fiado)}</strong>
                </div>

                <div class="summary-item">
                    <span>Pagamento de fiados</span>
                    <strong>${dinheiro(recebidoFiado)}</strong>
                </div>

            </div>

        </div>

        <div class="section">

            <h2>Resumo</h2>

            <div class="summary-grid">

                <div class="summary-item">
                    <span>Total de vendas</span>
                    <strong>${dinheiro(totalVendasDia(data))}</strong>
                </div>

                <div class="summary-item">
                    <span>Total de saídas</span>
                    <strong>${dinheiro(saidasTotal)}</strong>
                </div>

            </div>

        </div>

        <div class="section">

            <h2>Conferência do dinheiro</h2>

            <div class="notice">
                O valor esperado considera somente o dinheiro físico:
                caixa inicial + vendas em dinheiro + recebimentos em
                dinheiro - saídas em dinheiro.
            </div>

            <div class="total-box">
                <span>Dinheiro esperado</span>
                <strong>${dinheiro(esperado)}</strong>
            </div>

            <div class="form-group">

                <label>Quanto há fisicamente no caixa?</label>

                <input
                    id="dinheiroContado"
                    type="number"
                    step="0.01"
                    placeholder="0,00"
                    oninput="calcularDiferenca()"
                >

            </div>

            <div class="total-box">

                <span>Diferença</span>

                <strong id="diferenca">
                    R$ 0,00
                </strong>

            </div>

        </div>

        <div class="section">

            <button class="btn btn-blue"
                onclick="compartilharFechamento()">
                📤 Compartilhar fechamento
            </button>

            <button class="btn btn-primary"
                onclick="imprimirFechamento()">
                🖨️ Imprimir / salvar PDF
            </button>

        </div>
    `;
}

function alterarCaixaInicial(valor){

    dados.caixaInicial = numero(valor);

    salvar();

    fechamento();
}

function calcularDiferenca(){

    const contado =
        numero(document.getElementById("dinheiroContado").value);

    const esperado =
        dinheiroEsperado(dados.dataAtual || hoje());

    const diferenca =
        contado - esperado;

    const el =
        document.getElementById("diferenca");

    el.textContent = dinheiro(diferenca);

    el.className =
        diferenca===0
        ? ""
        : diferenca>0
        ? "difference-positive"
        : "difference-negative";
}

function textoFechamento(){

    const data = dados.dataAtual || hoje();

    return `
MEU CAIXA
Fechamento - ${formatarData(data)}

Caixa inicial: ${dinheiro(dados.caixaInicial)}

VENDAS
Dinheiro: ${dinheiro(totalPorPagamento(data,"Dinheiro"))}
Pix: ${dinheiro(totalPorPagamento(data,"Pix"))}
Débito: ${dinheiro(totalPorPagamento(data,"Débito"))}
Crédito: ${dinheiro(totalPorPagamento(data,"Crédito"))}
Fiado: ${dinheiro(totalPorPagamento(data,"Fiado"))}

Pagamento de fiados:
${dinheiro(pagamentosFiadosDia(data))}

Total de vendas:
${dinheiro(totalVendasDia(data))}

Saídas:
${dinheiro(totalSaidasDia(data))}

Dinheiro esperado no caixa:
${dinheiro(dinheiroEsperado(data))}
`.trim();
}

function compartilharFechamento(){

    const texto = textoFechamento();

    if(navigator.share){

        navigator.share({
            title:"Fechamento Meu Caixa",
            text:texto
        });

    }else{

        navigator.clipboard.writeText(texto);

        alert("Fechamento copiado para a área de transferência.");

    }
}

function imprimirFechamento(){

    const texto = textoFechamento();

    const janela = window.open("","_blank");

    if(!janela){
        alert("O navegador bloqueou a janela de impressão.");
        return;
    }

    janela.document.write(`
        <html>
        <head>
            <title>Fechamento Meu Caixa</title>
            <style>
                body{
                    font-family:Arial;
                    padding:30px;
                    white-space:pre-line;
                }
            </style>
        </head>
        <body>
            ${esc(texto)}
        </body>
        </html>
    `);

    janela.document.close();

    janela.print();
}

/* =========================================================
   NOVO DIA
   ========================================================= */

function novoDia(){

    const novaData = prompt(
        "Data do novo dia (AAAA-MM-DD):",
        hoje()
    );

    if(!novaData) return;

    if(!/^\d{4}-\d{2}-\d{2}$/.test(novaData)){
        alert("Data inválida.");
        return;
    }

    dados.dataAtual = novaData;

    /*
      O caixa inicial NÃO é automaticamente copiado.
      Você define o valor do novo dia.
    */

    const valor = prompt(
        "Qual será o caixa inicial deste novo dia?",
        "0"
    );

    dados.caixaInicial = numero(valor);

    salvar();

    alert("Novo dia iniciado!");

    inicio();
}


/* =========================================================
   BACKUP
   ========================================================= */

function backup(){

    const conteudo =
        JSON.stringify(dados,null,2);

    const blob =
        new Blob(
            [conteudo],
            {type:"application/json"}
        );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;

    a.download =
        `meu-caixa-backup-${dados.dataAtual || hoje()}.json`;

    a.click();

    URL.revokeObjectURL(url);
}

function restaurarBackup(){

    const input =
        document.createElement("input");

    input.type = "file";
    input.accept = ".json,application/json";

    input.onchange = function(){

        const arquivo = input.files[0];

        if(!arquivo) return;

        const leitor = new FileReader();

        leitor.onload = function(){

            try{

                const recuperado =
                    JSON.parse(leitor.result);

                if(!recuperado ||
                    !Array.isArray(recuperado.produtos) ||
                    !Array.isArray(recuperado.vendas)
                ){
                    throw new Error("Backup inválido");
                }

                if(!confirm(
                    "Restaurar este backup substituirá os dados atuais. Continuar?"
                )){
                    return;
                }

                dados = recuperado;

                salvar();

                alert("Backup restaurado!");

                inicio();

            }catch(e){

                alert("Não foi possível restaurar esse backup.");
                console.error(e);

            }
        };

        leitor.readAsText(arquivo);
    };

    input.click();
}


/* =========================================================
   SEGURANÇA BÁSICA PARA TEXTO
   ========================================================= */

function esc(texto){

    return String(texto ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}


/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */

dados.dataAtual =
    dados.dataAtual || hoje();

salvar();

inicio();

</script>
