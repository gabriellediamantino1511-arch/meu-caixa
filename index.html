<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meu Caixa</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f4f4;
    color: #222;
}

.app {
    max-width: 650px;
    margin: auto;
    min-height: 100vh;
    background: white;
}

header {
    background: #222;
    color: white;
    padding: 20px;
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 10;
}

header h1 {
    margin: 0;
    font-size: 25px;
}

header p {
    margin: 7px 0 0;
    font-size: 14px;
}

main {
    padding: 18px;
}

.card {
    background: #f5f5f5;
    padding: 15px;
    border-radius: 12px;
    margin-bottom: 12px;
}

.resumo {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.valor {
    font-size: 20px;
    font-weight: bold;
    margin-top: 6px;
}

.menu {
    display: grid;
    gap: 10px;
    margin-top: 18px;
}

button {
    width: 100%;
    border: 0;
    padding: 13px;
    border-radius: 9px;
    background: #222;
    color: white;
    font-size: 16px;
    cursor: pointer;
}

button.secundario {
    background: #ddd;
    color: #222;
}

button.perigo {
    background: #b00020;
}

button.sucessoBtn {
    background: #176b43;
}

input,
select {
    width: 100%;
    padding: 12px;
    margin-top: 6px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 16px;
}

input:read-only {
    background: #eee;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 12px;
}

h2 {
    margin-top: 0;
}

.item {
    background: #f5f5f5;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
}

.item strong {
    font-size: 17px;
}

.item-acoes {
    display: flex;
    gap: 6px;
    margin-top: 10px;
}

.item-acoes button {
    font-size: 12px;
    padding: 8px;
}

.total-box {
    background: #222;
    color: white;
    padding: 16px;
    border-radius: 10px;
    margin: 15px 0;
    font-size: 20px;
    font-weight: bold;
}

.separador {
    margin: 20px 0;
    border: 0;
    border-top: 1px solid #ddd;
}

.vazio {
    text-align: center;
    color: #777;
    padding: 25px 10px;
}

.negativo {
    color: #b00020;
}

.positivo {
    color: #176b43;
}

@media (max-width: 450px) {
    main {
        padding: 12px;
    }

    .resumo {
        grid-template-columns: 1fr 1fr;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <h1>MEU CAIXA</h1>
    <p id="dataAtual"></p>
</header>

<main id="app"></main>

</div>

<script>

const CHAVE = "meuCaixaDados";

function hoje() {

    const d = new Date();

    return (
        d.getFullYear() +
        "-" +
        String(d.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(d.getDate()).padStart(2, "0")
    );
}


const padrao = {

    produtos: [],
    vendas: [],
    saidas: [],
    fiados: [],
    dias: [],
    caixaInicial: 0,
    dataAtual: hoje()

};


let dados =
    JSON.parse(
        localStorage.getItem(CHAVE) || "null"
    ) || padrao;


dados.produtos = dados.produtos || [];
dados.vendas = dados.vendas || [];
dados.saidas = dados.saidas || [];
dados.fiados = dados.fiados || [];
dados.dias = dados.dias || [];

dados.caixaInicial =
    Number(dados.caixaInicial || 0);

dados.dataAtual =
    dados.dataAtual || hoje();


let carrinho = [];

let vendaEditandoId = null;


/* =========================
   FUNÇÕES BÁSICAS
========================= */

function salvar() {

    localStorage.setItem(
        CHAVE,
        JSON.stringify(dados)
    );

}


function id() {

    return Date.now() + Math.random();

}


function dinheiro(valor) {

    return Number(valor || 0).toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );

}


function formatarData(data) {

    if (!data) return "";

    const partes =
        data.split("-");

    if (partes.length !== 3)
        return data;

    return (
        partes[2] +
        "/" +
        partes[1] +
        "/" +
        partes[0]
    );

}


function esc(texto) {

    return String(texto ?? "")
        .replace(/[&<>"']/g, function(m) {

            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#039;"
            }[m];

        });

}


function atualizarData() {

    document.getElementById(
        "dataAtual"
    ).innerText =
        formatarData(
            dados.dataAtual
        );

}


/* =========================
   INÍCIO
========================= */

function inicio() {

    atualizarData();

    const vendasHoje =
        dados.vendas.filter(
            v =>
                v.data ===
                dados.dataAtual
        );


    const saidasHoje =
        dados.saidas.filter(
            s =>
                s.data ===
                dados.dataAtual
        );


    const fiadosPendentes =
        dados.fiados.filter(
            f =>
                f.status ===
                "Pendente"
        );


    const totalVendas =
        vendasHoje.reduce(
            (s, v) =>
                s + Number(v.total),
            0
        );


    const totalSaidas =
        saidasHoje.reduce(
            (s, v) =>
                s + Number(v.valor),
            0
        );


    const totalFiados =
        fiadosPendentes.reduce(
            (s, v) =>
                s + Number(v.valor),
            0
        );


    document.getElementById(
        "app"
    ).innerHTML = `

        <div class="card">

            <strong>
                Caixa inicial
            </strong>

            <div class="valor">
                ${dinheiro(
                    dados.caixaInicial
                )}
            </div>

        </div>


        <div class="resumo">

            <div class="card">

                <strong>
                    Vendas
                </strong>

                <div class="valor">
                    ${dinheiro(
                        totalVendas
                    )}
                </div>

            </div>


            <div class="card">

                <strong>
                    Saídas
                </strong>

                <div class="valor">
                    ${dinheiro(
                        totalSaidas
                    )}
                </div>

            </div>


            <div class="card">

                <strong>
                    Fiados pendentes
                </strong>

                <div class="valor">
                    ${dinheiro(
                        totalFiados
                    )}
                </div>

            </div>


            <div class="card">

                <strong>
                    Produtos
                </strong>

                <div class="valor">
                    ${dados.produtos.length}
                </div>

            </div>

        </div>


        <div class="menu">

            <button onclick="novaVenda()">
                🛒 Nova venda
            </button>

            <button onclick="estoque()">
                📦 Estoque
            </button>

            <button onclick="fiados()">
                👤 Fiados
            </button>

            <button onclick="novaSaida()">
                💸 Saídas
            </button>

            <button onclick="fechamento()">
                📊 Fechamento
            </button>

            <button onclick="historico()">
                📚 Histórico
            </button>

            <button onclick="cadastroProdutos()">
                ⚙️ Produtos
            </button>

            <button onclick="novoDia()">
                📅 Novo dia
            </button>

            <button onclick="backup()">
                💾 Backup
            </button>

        </div>

    `;

}


/* =========================
   PRODUTOS
========================= */

function cadastroProdutos() {

    let lista = "";


    dados.produtos.forEach(
        function(p, i) {

            lista += `

                <div class="item">

                    <strong>
                        ${esc(p.nome)}
                    </strong>

                    <br>

                    Preço:
                    ${dinheiro(p.preco)}

                    <br>

                    Estoque:
                    ${p.estoque}


                    <div class="item-acoes">

                        <button
                            onclick="editarProduto(${i})">

                            Editar

                        </button>


                        <button
                            class="perigo"
                            onclick="excluirProduto(${i})">

                            Excluir

                        </button>

                    </div>

                </div>

            `;

        }
    );


    if (!lista) {

        lista = `

            <div class="vazio">

                Nenhum produto cadastrado.

            </div>

        `;

    }


    document.getElementById(
        "app"
    ).innerHTML = `

        <h2>
            Cadastro de produtos
        </h2>


        <div class="card">

            <label>
                Nome do produto
            </label>

            <input
                id="nomeProduto"
                placeholder="Ex.: Coxinha"
            >


            <label>
                Preço
            </label>

            <input
                id="precoProduto"
                type="number"
                step="0.01"
                min="0"
                placeholder="0,00"
            >


            <label>
                Quantidade em estoque
            </label>

            <input
                id="estoqueProduto"
                type="number"
                min="0"
                value="0"
            >


            <br><br>


            <button
                onclick="cadastrarProduto()">

                Cadastrar produto

            </button>

        </div>


        <hr class="separador">


        <h2>
            Produtos cadastrados
        </h2>


        ${lista}


        <button
            class="secundario"
            onclick="inicio()">

            Voltar

        </button>

    `;

}


function cadastrarProduto() {

    const nome =
        document
        .getElementById(
            "nomeProduto"
        )
        .value
        .trim();


    const preco =
        Number(
            document
            .getElementById(
                "precoProduto"
            )
            .value
        );


    const estoque =
        Number(
            document
            .getElementById(
                "estoqueProduto"
            )
            .value
        );


    if (
        !nome ||
        preco <= 0 ||
        estoque < 0
    ) {

        alert(
            "Informe nome, preço e estoque válidos."
        );

        return;

    }


    dados.produtos.push({

        id: id(),

        nome: nome,

        preco: preco,

        estoque: estoque

    });


    salvar();

    cadastroProdutos();

}


function editarProduto(i) {

    const produto =
        dados.produtos[i];


    const nome =
        prompt(
            "Nome do produto:",
            produto.nome
        );


    if (nome === null)
        return;


    const preco =
        Number(
            prompt(
                "Preço:",
                produto.preco
            )
        );


    if (
        !Number.isFinite(preco) ||
        preco <= 0
    ) {

        alert("Preço inválido.");

        return;

    }


    const estoque =
        Number(
            prompt(
                "Estoque atual:",
                produto.estoque
            )
        );


    if (
        !Number.isFinite(estoque) ||
        estoque < 0
    ) {

        alert("Estoque inválido.");

        return;

    }


    produto.nome =
        nome.trim() || produto.nome;

    produto.preco =
        preco;

    produto.estoque =
        estoque;


    salvar();

    cadastroProdutos();

}


function excluirProduto(i) {

    const produto =
        dados.produtos[i];


    const usado =
        dados.vendas.some(
            venda =>
                venda.itens?.some(
                    item =>
                        item.produtoId ===
                        produto.id
                )
        );


    if (usado) {

        alert(
            "Este produto já aparece em uma venda e não pode ser excluído."
        );

        return;

    }


    if (
        confirm(
            `Excluir ${produto.nome}?`
        )
    ) {

        dados.produtos.splice(
            i,
            1
        );

        salvar();

        cadastroProdutos();

    }

}


/* =========================
   ESTOQUE
========================= */

function estoque() {

    let lista = "";


    dados.produtos.forEach(
        function(p, i) {

            lista += `

                <div class="item">

                    <strong>
                        ${esc(p.nome)}
                    </strong>

                    <br>

                    Estoque atual:

                    <strong>
                        ${p.estoque}
                    </strong>


                    <div class="item-acoes">

                        <button
                            onclick="entradaEstoque(${i})">

                            + Entrada

                        </button>


                        <button
                            onclick="perdaEstoque(${i})">

                            − Perda

                        </button>


                        <button
                            onclick="ajustarEstoque(${i})">

                            Ajustar

                        </button>

                    </div>

                </div>

            `;

        }
    );


    if (!lista) {

        lista = `

            <div class="vazio">

                Cadastre produtos primeiro.

            </div>

        `;

    }


    document.getElementById(
        "app"
    ).innerHTML = `

        <h2>
            Estoque
        </h2>

        ${lista}


        <button
            class="secundario"
            onclick="inicio()">

            Voltar

        </button>

    `;

}


function entradaEstoque(i) {

    const quantidade =
        Number(
            prompt(
                "Quantas unidades entraram?"
            )
        );


    if (
        !Number.isFinite(quantidade) ||
        quantidade <= 0
    ) {

        alert(
            "Quantidade inválida."
        );

        return;

    }


    dados.produtos[i].estoque +=
        quantidade;


    salvar();

    estoque();

}


function perdaEstoque(i) {

    const produto =
        dados.produtos[i];


    const quantidade =
        Number(
            prompt(
                `Quantas unidades de ${produto.nome} foram perdidas?`
            )
        );


    if (
        !Number.isFinite(quantidade) ||
        quantidade <= 0 ||
        quantidade > produto.estoque
    ) {

        alert(
            "Quantidade inválida."
        );

        return;

    }


    produto.estoque -=
        quantidade;


    salvar();

    estoque();

}


function ajustarEstoque(i) {

    const quantidade =
        Number(
            prompt(
                "Nova quantidade em estoque:",
                dados.produtos[i].estoque
            )
        );


    if (
        !Number.isFinite(quantidade) ||
        quantidade < 0
    ) {

        alert(
            "Quantidade inválida."
        );

        return;

    }


    dados.produtos[i].estoque =
        quantidade;


    salvar();

    estoque();

}


/* =========================
   NOVA VENDA
========================= */

function novaVenda() {

    carrinho = [];

    vendaEditandoId = null;

    mostrarVenda();

}


function editarVenda(vendaId) {

    const venda =
        dados.vendas.find(
            v =>
                v.id ===
                vendaId
        );


    if (!venda)
        return;


    /*
       Devolve os produtos
       da venda antiga ao estoque.
    */

    venda.itens.forEach(
        item => {

            const produto =
                dados.produtos.find(
                    p =>
                        p.id ===
                        item.produtoId
                );


            if (produto) {

                produto.estoque +=
                    Number(
                        item.quantidade
                    );

            }

        }
    );


    carrinho =
        JSON.parse(
            JSON.stringify(
                venda.itens
            )
        );


    vendaEditandoId =
        vendaId;


    salvar();

    mostrarVenda();

}


function mostrarVenda() {

    let opcoes = `

        <option value="">
            Selecione um produto
        </option>

    `;


    dados.produtos.forEach(
        function(p, i) {

            opcoes += `

                <option value="${i}">

                    ${esc(p.nome)}
                    -
                    ${dinheiro(p.preco)}

                    |
                    Estoque:
                    ${p.estoque}

                </option>

            `;

        }
    );


    let itens = "";


    carrinho.forEach(
        function(item, i) {

            itens += `

                <div class="item">

                    <strong>
                        ${esc(item.nome)}
                    </strong>

                    <br>

                    ${item.quantidade}
                    x
                    ${dinheiro(item.preco)}

                    =

                    <strong>
                        ${dinheiro(item.total)}
                    </strong>


                    <div class="item-acoes">

                        <button
                            class="perigo"
                            onclick="removerCarrinho(${i})">

                            Remover

                        </button>

                    </div>

                </div>

            `;

        }
    );


    const total =
        carrinho.reduce(
            (s, item) =>
                s +
                Number(item.total),
            0
        );


    const vendaAtual =
        vendaEditandoId
        ? dados.vendas.find(
            v =>
                v.id ===
                vendaEditandoId
        )
        : null;


    document.getElementById(
        "app"
    ).innerHTML = `

        <h2>

            ${
                vendaEditandoId
                ? "Editar venda"
                : "Nova venda"
            }

        </h2>


        <div class="card">

            <label>
                Produto
            </label>

            <select
                id="produtoVenda"
                onchange="preencherPrecoVenda()">

                ${opcoes}

            </select>


            <label>
                Quantidade
            </label>

            <input
                id="quantidadeVenda"
                type="number"
                min="1"
                value="1"
            >


            <label>
                Valor unitário
            </label>

            <input
                id="valorVenda"
                readonly
            >


            <br><br>


            <button
                onclick="adicionarCarrinho()">

                Adicionar produto

            </button>

        </div>


        <h3>
            Itens da venda
        </h3>


        ${
            itens ||
            `
                <div class="vazio">

                    Nenhum produto adicionado.

                </div>
            `
        }


        <div class="total-box">

            Total:
            ${dinheiro(total)}

        </div>


        <div class="card">

            <label>
                Forma de pagamento
            </label>


            <select
                id="pagamentoVenda">

                <option
                    ${
                        vendaAtual?.pagamento ===
                        "Dinheiro"
                        ? "selected"
                        : ""
                    }
                >
                    Dinheiro
                </option>


                <option
                    ${
                        vendaAtual?.pagamento ===
                        "Pix"
                        ? "selected"
                        : ""
                    }
                >
                    Pix
                </option>


                <option
                    ${
                        vendaAtual?.pagamento ===
                        "Débito"
                        ? "selected"
                        : ""
                    }
                >
                    Débito
                </option>


                <option
                    ${
                        vendaAtual?.pagamento ===
                        "Crédito"
                        ? "selected"
                        : ""
                    }
                >
                    Crédito
                </option>


                <option
                    ${
                        vendaAtual?.pagamento ===
                        "Fiado"
                        ? "selected"
                        : ""
                    }
                >
                    Fiado
                </option>

            </select>

        </div>


        <button
            onclick="registrarVenda()">

            ${
                vendaEditandoId
                ? "Salvar alteração"
                : "Registrar venda"
            }

        </button>


        <br><br>


        <button
            class="secundario"
            onclick="inicio()">

            Cancelar

        </button>

    `;

}


function preencherPrecoVenda() {

    const indice =
        document.getElementById(
            "produtoVenda"
        ).value;


    const campo =
        document.getElementById(
            "valorVenda"
        );


    if (indice === "") {

        campo.value = "";

        return;

    }


    campo.value =
        Number(
            dados.produtos[indice].preco
        ).toFixed(2);

}


function adicionarCarrinho() {

    const indice =
        document.getElementById(
            "produtoVenda"
        ).value;


    const quantidade =
        Number(
            document.getElementById(
                "quantidadeVenda"
            ).value
        );


    if (
        indice === "" ||
        quantidade <= 0
    ) {

        alert(
            "Selecione um produto e informe uma quantidade válida."
        );

        return;

    }


    const produto =
        dados.produtos[indice];


    const existente =
        carrinho.find(
            item =>
                item.produtoId ===
                produto.id
        );


    const quantidadeTotal =
        (
            existente
            ? existente.quantidade
            : 0
        ) +
        quantidade;


    if (
        quantidadeTotal >
        produto.estoque
    ) {

        alert(
            `Estoque insuficiente. Disponível: ${produto.estoque}`
        );

        return;

    }


    if (existente) {

        existente.quantidade =
            quantidadeTotal;


        existente.total =
            quantidadeTotal *
            existente.preco;

    } else {

        carrinho.push({

            produtoId:
                produto.id,

            nome:
                produto.nome,

            preco:
                Number(
                    produto.preco
                ),

            quantidade:
                quantidade,

            total:
                Number(
                    produto.preco
                ) *
                quantidade

        });

    }


    /*
       Reserva o estoque
       enquanto a venda está sendo montada.
    */

    produto.estoque -=
        quantidade;


    salvar();

    mostrarVenda();

}


function removerCarrinho(i) {

    const item =
        carrinho[i];


    const produto =
        dados.produtos.find(
            p =>
                p.id ===
                item.produtoId
        );


    if (produto) {

        produto.estoque +=
            Number(
                item.quantidade
            );

    }


    carrinho.splice(
        i,
        1
    );


    salvar();

    mostrarVenda();

}


function registrarVenda() {

    if (
        carrinho.length === 0
    ) {

        alert(
            "Adicione pelo menos um produto."
        );

        return;

    }


    const pagamento =
        document.getElementById(
            "pagamentoVenda"
        ).value;


    const total =
        carrinho.reduce(
            (s, item) =>
                s +
                Number(item.total),
            0
        );


    const vendaExistente =
        vendaEditandoId
        ? dados.vendas.find(
            v =>
                v.id ===
                vendaEditandoId
        )
        : null;


    /*
       FIADO
    */

    if (
        pagamento ===
        "Fiado"
    ) {

        let pessoa = "";


        if (
            vendaExistente &&
            vendaExistente.fiadoId
        ) {

            const fiado =
                dados.fiados.find(
                    f =>
                        f.id ===
                        vendaExistente.fiadoId
                );


            if (fiado) {

                pessoa =
                    fiado.pessoa;

            }

        }


        pessoa =
            prompt(
                "Nome da pessoa:",
                pessoa
            );


        if (!pessoa) {

            /*
               Se a venda estava sendo editada,
               devolve o estoque porque a operação
               foi cancelada.
            */

            carrinho.forEach(
                item => {

                    const produto =
                        dados.produtos.find(
                            p =>
                                p.id ===
                                item.produtoId
                        );

                    if (produto) {

                        produto.estoque +=
                            Number(
                                item.quantidade
                            );

                    }

                }
            );


            salvar();

            return;

        }


        if (
            vendaExistente &&
            vendaExistente.fiadoId
        ) {

            const fiado =
                dados.fiados.find(
                    f =>
                        f.id ===
                        vendaExistente.fiadoId
                );


            if (fiado) {

                fiado.pessoa =
                    pessoa;

                fiado.valor =
                    total;

            }

        } else {

            const novoFiado = {

                id: id(),

                pessoa:
                    pessoa,

                valor:
                    total,

                data:
                    dados.dataAtual,

                status:
                    "Pendente",

                pagamento:
                    null

            };


            dados.fiados.push(
                novoFiado
            );


            if (vendaExistente) {

                vendaExistente.fiadoId =
                    novoFiado.id;

            }

        }

    }


    /*
       Se uma venda que era fiado
       passar para outro pagamento,
       remove o fiado relacionado.
    */

    if (
        vendaExistente &&
        vendaExistente.fiadoId &&
        pagamento !== "Fiado"
    ) {

        dados.fiados =
            dados.fiados.filter(
                f =>
                    f.id !==
                    vendaExistente.fiadoId
            );

    }


    /*
       SALVAR VENDA
    */

    if (vendaExistente) {

        vendaExistente.itens =
            JSON.parse(
                JSON.stringify(
                    carrinho
                )
            );


        vendaExistente.total =
            total;


        vendaExistente.pagamento =
            pagamento;

    } else {

        dados.vendas.push({

            id: id(),

            data:
                dados.dataAtual,

            itens:
                JSON.parse(
                    JSON.stringify(
                        carrinho
                    )
                ),

            total:
                total,

            pagamento:
                pagamento

        });

    }


    salvar();


    carrinho = [];

    vendaEditandoId =
        null;


    alert(
        "Venda salva com sucesso!"
    );


    inicio();

}


function cancelarVenda(vendaId) {

    const venda =
        dados.vendas.find(
            v =>
                v.id ===
                vendaId
        );


    if (!venda)
        return;


    if (
        !confirm(
            "Cancelar esta venda? Os produtos voltarão ao estoque."
        )
    ) {

        return;

    }


    venda.itens.forEach(
        item => {

            const produto =
                dados.produtos.find(
                    p =>
                        p.id ===
                        item.produtoId
                );


            if (produto) {

                produto.estoque +=
                    Number(
                        item.quantidade
                    );

            }

        }
    );


    if (venda.fiadoId) {

        dados.fiados =
            dados.fiados.filter(
                f =>
                    f.id !==
                    venda.fiadoId
            );

    }


    dados.vendas =
        dados.vendas.filter(
            v =>
                v.id !==
                vendaId
        );


    salvar();

    historico();

}

/* =========================
   FECHAMENTO
========================= */

function calcularDadosFechamento(
    data
) {

    const vendas =
        dados.vendas.filter(
            v =>
                v.data ===
                data
        );


    const saidas =
        dados.saidas.filter(
            s =>
                s.data ===
                data
        );


    function soma(
        lista,
        funcao
    ) {

        return lista.reduce(
            (total, item) =>
                total +
                Number(
                    funcao(item) || 0
                ),
            0
        );

    }


    const dinheiroVendas =
        soma(
            vendas,
            v =>
                v.pagamento ===
                "Dinheiro"
                ? v.total
                : 0
        );


    const pix =
        soma(
            vendas,
            v =>
                v.pagamento ===
                "Pix"
                ? v.total
                : 0
        );


    const debito =
        soma(
            vendas,
            v =>
                v.pagamento ===
                "Débito"
                ? v.total
                : 0
        );


    const credito =
        soma(
            vendas,
            v =>
                v.pagamento ===
                "Crédito"
                ? v.total
                : 0
        );


    const fiado =
        soma(
            vendas,
            v =>
                v.pagamento ===
                "Fiado"
                ? v.total
                : 0
        );


    const pagamentos =
        dados.fiados.filter(
            f =>
                f.status ===
                "Pago" &&
                f.dataPagamento ===
                data
        );


    const pagamentosDinheiro =
        soma(
            pagamentos,
            f =>
                f.pagamento ===
                "Dinheiro"
                ? f.valor
                : 0
        );


    const pagamentosPix =
        soma(
            pagamentos,
            f =>
                f.pagamento ===
                "Pix"
                ? f.valor
                : 0
        );


    const pagamentosDebito =
        soma(
            pagamentos,
            f =>
                f.pagamento ===
                "Débito"
                ? f.valor
                : 0
        );


    const pagamentosCredito =
        soma(
            pagamentos,
            f =>
                f.pagamento ===
                "Crédito"
                ? f.valor
                : 0
        );


    const saidasTotal =
        soma(
            saidas,
            s => s.valor
        );


    const saidasDinheiro =
        soma(
            saidas,
            s =>
                s.pagamento ===
                "Dinheiro"
                ? s.valor
                : 0
        );


    const totalVendas =
        soma(
            vendas,
            v => v.total
        );


    const totalRecebido =
        dinheiroVendas +
        pix +
        debito +
        credito +
        pagamentosDinheiro +
        pagamentosPix +
        pagamentosDebito +
        pagamentosCredito;


    const caixaEsperado =
        Number(
            dados.caixaInicial
        ) +
        dinheiroVendas +
        pagamentosDinheiro -
        saidasDinheiro;


    return {

        vendas,

        saidas,

        pagamentos,

        dinheiroVendas,

        pix,

        debito,

        credito,

        fiado,

        pagamentosDinheiro,

        pagamentosPix,

        pagamentosDebito,

        pagamentosCredito,

        saidasTotal,

        saidasDinheiro,

        totalVendas,

        totalRecebido,

        caixaEsperado

    };

}

function historico() {

    const datas =
        new Set();


    datas.add(
        dados.dataAtual
    );


    dados.vendas.forEach(
        v =>
            datas.add(v.data)
    );


    dados.saidas.forEach(
        s =>
            datas.add(s.data)
    );


    dados.fiados.forEach(
        f => {

            datas.add(f.data);

            if (
                f.dataPagamento
            ) {

                datas.add(
                    f.dataPagamento
                );

            }

        }
    );


    const lista =
        Array.from(datas)
            .sort()
            .reverse();


    let html = "";


    lista.forEach(
        data => {

            const total =
                dados.vendas
                    .filter(
                        v =>
                            v.data ===
                            data
                    )
                    .reduce(
                        (s, v) =>
                            s +
                            Number(
                                v.total
                            ),

                    );


            html += `

        "app"

function detalhesDia(
    data
) {

    const vendas =
        dados.vendas.filter(
            v =>
                v.data ===
                data
        );


    const saidas =
        dados.saidas.filter(
            s =>
                s.data ===
                data
        );


    const fiados =
        dados.fiados.filter(
            f =>
                f.data ===
                data
        );


    const pagamentos =
        dados.fiados.filter(
            f =>
                f.status ===
                "Pago" &&
                f.dataPagamento ===
                data
        );


    let html = `

        <h2>
            ${formatarData(data)}
        </h2>


        <h3>
            Vendas
        </h3>

    `;


    if (
        vendas.length === 0
    ) {

        html += `

            <div class="vazio">

                Nenhuma venda.

            </div>

        `;

    } else {

        vendas.forEach(
            venda => {

                html += `

                    <div class="item">

                        <strong>

                            ${dinheiro(
                                venda.total
                            )}

                        </strong>


                        <br>

                        Pagamento:

                        ${esc(
                            venda.pagamento
                        )}


                        <br><br>


                        ${
                            (venda.itens || [])
                                .map(
                                    item =>
                                        `
                                        ${item.quantidade}
                                        x
                                        ${esc(item.nome)}
                                        -
                                        ${dinheiro(item.preco)}
                                        `
                                )
                                .join("<br>")
                        }


                        <div class="item-acoes">

                            <button
                                onclick="editarVenda(${venda.id})">

                                Editar

                            </button>


                            <button
                                class="perigo"
                                onclick="cancelarVenda(${venda.id})">

                                Cancelar

                            </button>

                        </div>

                    </div>

                `;

            }
        );

    }


    html += `

        <h3>
            Saídas
        </h3>

    `;


    if (
        saidas.length === 0
    ) {

        html += `

            <div class="vazio">

                Nenhuma saída.

            </div>

        `;

    } else {

        saidas.forEach(
            saida => {

                html += `

                    <div class="item">

                        ${esc(
                            saida.motivo
                        )}

                        <br>

                        ${dinheiro(
                            saida.valor
                        )}

                        <br>

                        ${esc(
                            saida.pagamento
                        )}


                        <div class="item-acoes">

                            <button
                                onclick="novaSaida(${saida.id})">

                                Editar

                            </button>


                            <button
                                class="perigo"
                                onclick="excluirSaida(${saida.id})">

                                Excluir

                            </button>

                        </div>

                    </div>

                `;

            }
        );

    }


    html += `

        <h3>
            Fiados criados
        </h3>

    `;


    if (
        fiados.length === 0
    ) {

        html += `

            <div class="vazio">

                Nenhum fiado criado.

            </div>

        `;

    } else {

        fiados.forEach(
            fiado => {

                html += `

                    <div class="item">

                        ${esc(
                            fiado.pessoa
                        )}

                        -

                        ${dinheiro(
                            fiado.valor
                        )}

                        -

                        ${esc(
                            fiado.status
                        )}

                    </div>

                `;

            }
        );

    }


    html += `

        <h3>
            Pagamentos de fiados recebidos
        </h3>

    `;


    if (
        pagamentos.length === 0
    ) {

        html += `

            <div class="vazio">

                Nenhum pagamento recebido.

            </div>

        `;

    } else {

        pagamentos.forEach(
            fiado => {

                html += `

                    <div class="item">

                        ${esc(
                            fiado.pessoa
                        )}

                        -

                        ${dinheiro(
                            fiado.valor
                        )}

                        -

                        ${esc(
                            fiado.pagamento
                        )}

                    </div>

                `;

            }
        );

    }


    html += `

        <button
            class="secundario"
            onclick="historico()">

            Voltar

        </button>

    `;


    document.getElementById(
        "app"
    ).innerHTML =
        html;

}


/* =========================
   NOVO DIA
========================= */

function novoDia() {

    const novaData =
        prompt(
            "Digite a data do novo dia (AAAA-MM-DD):",
            hoje()
        );


    if (!novaData)
        return;


    if (
        !/^\d{4}-\d{2}-\d{2}$/.test(
            novaData
        )
    ) {

        alert(
            "Use o formato AAAA-MM-DD."
        );

        return;

    }


    const caixa =
        Number(
            prompt(
                "Qual será o caixa inicial deste dia?",
                "0"
            )
        );


    if (
        !Number.isFinite(caixa) ||
        caixa < 0
    ) {

        alert(
            "Valor inválido."
        );

        return;

    }


    dados.dataAtual =
        novaData;


    dados.caixaInicial =
        caixa;


    salvar();

    inicio();

}


/* =========================
   COMPARTILHAR
========================= */

function gerarTextoFechamento() {

    const x =
        calcularDadosFechamento(
            dados.dataAtual
        );


    const fiadosCriados =
        dados.fiados.filter(
            f =>
                f.data ===
                dados.dataAtual
        );


    const fiadosPendentes =
        fiadosCriados.filter(
            f =>
                f.status ===
                "Pendente"
        );


    const totalPendentes =
        fiadosPendentes.reduce(
            (s, f) =>
                s +
                Number(f.valor),
            0
        );


    return `

MEU CAIXA

Data:
${formatarData(dados.dataAtual)}


========================
VENDAS
========================

Dinheiro:
${dinheiro(x.dinheiroVendas)}

Pix:
${dinheiro(x.pix)}

Débito:
${dinheiro(x.debito)}

Crédito:
${dinheiro(x.credito)}

Fiadas:
${dinheiro(x.fiado)}

TOTAL DE VENDAS:
${dinheiro(x.totalVendas)}


========================
PAGAMENTOS DE FIADOS
========================

Dinheiro:
${dinheiro(x.pagamentosDinheiro)}

Pix:
${dinheiro(x.pagamentosPix)}

Débito:
${dinheiro(x.pagamentosDebito)}

Crédito:
${dinheiro(x.pagamentosCredito)}

TOTAL RECEBIDO:
${dinheiro(x.totalRecebido)}


========================
FIADOS
========================

Pendentes criados no dia:
${dinheiro(totalPendentes)}


${
    fiadosCriados.length
    ?
    fiadosCriados
        .map(
            f =>
                `${f.pessoa} - ${dinheiro(f.valor)} - ${f.status}`
        )
        .join("\n")
    :
    "Nenhum fiado criado neste dia."
}


========================
SAÍDAS
========================

Total:
${dinheiro(x.saidasTotal)}

Em dinheiro:
${dinheiro(x.saidasDinheiro)}


========================
CAIXA
========================

Caixa inicial:
${dinheiro(dados.caixaInicial)}

Caixa esperado:
${dinheiro(x.caixaEsperado)}


Gerado pelo Meu Caixa.

`;

}


function compartilharFechamento() {

    const texto =
        gerarTextoFechamento();


    if (
        navigator.share
    ) {

        navigator.share({

            title:
                "Fechamento Meu Caixa",

            text:
                texto

        });

    } else {

        navigator
            .clipboard
            .writeText(texto)
            .then(
                () => {

                    alert(
                        "Fechamento copiado para a área de transferência."
                    );

                }
            );

    }

}


/* =========================
   BACKUP
========================= */

function backup() {

    const texto =
        JSON.stringify(
            dados,
            null,
            2
        );


    const blob =
        new Blob(
            [texto],
            {
                type:
                    "application/json"
            }
        );


    const url =
        URL.createObjectURL(
            blob
        );


    const a =
        document.createElement(
            "a"
        );


    a.href =
        url;


    a.download =
        `backup-meu-caixa-${dados.dataAtual}.json`;


    a.click();


    URL.revokeObjectURL(
        url
    );

}


/* =========================
   INICIAR
========================= */

inicio();
